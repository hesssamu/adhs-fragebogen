<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, maximum-scale=1" />
<meta name="robots" content="noindex, nofollow" />
<meta name="theme-color" content="#3f6cf6" />
<title>Fragebogen ADHS &ndash; für Eltern</title>
<script src="vendor/jspdf.umd.min.js"></script>
<script>
  // Fallback auf CDN, falls die lokale Datei nicht lädt
  if(!window.jspdf){
    document.write('<script src="https://unpkg.com/jspdf@2.5.2/dist/jspdf.umd.min.js"><\/script>');
  }
</script>
<style>
  :root{
    --bg:#eef1f6; --card:#ffffff; --ink:#1f2733; --muted:#67727f;
    --line:#e2e8f0; --brand:#3f6cf6; --brand-d:#3559d6; --ok:#1f9d57;
    --shadow:0 1px 3px rgba(20,30,50,.06),0 10px 30px rgba(20,30,50,.08);
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;padding:0;height:100%}
  body{
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    background:var(--bg); color:var(--ink); line-height:1.45;
    font-size:17px; -webkit-text-size-adjust:100%;
    min-height:100dvh; display:flex; flex-direction:column;
  }
  /* top progress */
  .top{position:sticky;top:0;z-index:20;background:rgba(238,241,246,.92);
    backdrop-filter:saturate(180%) blur(8px);padding:14px 16px calc(10px + env(safe-area-inset-top))}
  .top .row{max-width:600px;margin:0 auto;display:flex;align-items:center;gap:12px}
  .back{appearance:none;border:0;background:transparent;color:var(--muted);font-size:15px;
    font-family:inherit;cursor:pointer;padding:6px 4px;min-width:64px;text-align:left;visibility:hidden}
  .back:active{color:var(--ink)}
  .ptxt{flex:1;text-align:center;font-size:13px;color:var(--muted);font-variant-numeric:tabular-nums}
  .spacer{min-width:64px}
  .track{max-width:600px;margin:10px auto 0;height:6px;background:#dde3ec;border-radius:99px;overflow:hidden}
  .fill{height:100%;width:0;background:var(--brand);border-radius:99px;transition:width .3s ease}

  main{flex:1;display:flex;flex-direction:column;justify-content:flex-start}
  .stagewrap{max-width:600px;width:100%;margin:0 auto;padding:8px 16px 40px;flex:1;
    display:flex;flex-direction:column}
  .stage{opacity:0;transform:translateY(10px);transition:opacity .22s ease,transform .22s ease;
    flex:1;display:flex;flex-direction:column}
  .stage.in{opacity:1;transform:none}

  .kicker{font-size:13px;letter-spacing:.05em;text-transform:uppercase;color:var(--brand);
    font-weight:700;margin:18px 2px 6px}
  h1{font-size:23px;line-height:1.3;margin:0 0 10px}
  .qtext{font-size:22px;line-height:1.34;font-weight:600;margin:8px 2px 22px}
  p.sub{color:var(--muted);font-size:15.5px;margin:0 0 8px}
  .author{color:var(--muted);font-size:12.5px;margin:18px 2px 0}
  .infoblock{display:flex;flex-direction:column;gap:10px;margin:18px 0 0}
  .infrow{display:flex;align-items:flex-start;gap:12px;padding:14px 14px;border:1px solid var(--line);
    border-radius:14px;background:var(--card);box-shadow:var(--shadow);font-size:16px}
  .infrow .ipill{flex:none;background:#eef2ff;color:var(--brand);font-weight:800;font-size:13px;
    padding:6px 10px;border-radius:9px;letter-spacing:.02em}

  /* options as big stacked cards */
  .opts{display:flex;flex-direction:column;gap:11px;margin-top:auto}
  .optbtn{appearance:none;font-family:inherit;text-align:left;width:100%;cursor:pointer;
    display:flex;align-items:center;gap:14px;padding:16px 16px;border:1.5px solid var(--line);
    border-radius:15px;background:var(--card);color:var(--ink);box-shadow:var(--shadow);
    transition:.12s;font-size:18px}
  .optbtn .badge{flex:none;width:38px;height:38px;border-radius:11px;background:#eef2ff;
    color:var(--brand);font-weight:800;font-size:19px;display:flex;align-items:center;justify-content:center}
  .optbtn .lab{font-weight:600}
  .optbtn:active{transform:scale(.985)}
  .optbtn.sel{border-color:var(--brand);background:var(--brand);color:#fff}
  .optbtn.sel .badge{background:rgba(255,255,255,.22);color:#fff}

  /* form fields (intro) */
  label.fld{display:block;margin:16px 0 0}
  label.fld span{display:block;font-size:14px;color:var(--muted);margin:0 0 6px}
  input[type=text],input[type=date]{width:100%;font-size:17px;padding:14px 14px;border:1.5px solid var(--line);
    border-radius:13px;background:#fbfcfe;color:var(--ink);font-family:inherit}
  input:focus{outline:none;border-color:var(--brand);background:#fff}

  /* primary button */
  .cta{appearance:none;border:0;font-family:inherit;width:100%;font-size:18px;font-weight:700;
    padding:16px 20px;border-radius:14px;cursor:pointer;background:var(--brand);color:#fff;
    box-shadow:var(--shadow);margin-top:22px}
  .cta:active{transform:scale(.99)}
  .cta.ghost{background:#fff;color:var(--brand);border:1.5px solid var(--line);box-shadow:none;margin-top:10px}
  .err{color:#c23b3b;font-size:14.5px;margin:14px 2px 0;display:none}
  .miss{border-color:#f0a8a8 !important;background:#fff6f6 !important}

  /* review list */
  .rev{margin:10px 0 0;display:flex;flex-direction:column;gap:8px}
  .revsec{font-size:12.5px;letter-spacing:.04em;text-transform:uppercase;color:var(--brand);
    font-weight:700;margin:14px 2px 2px}
  .revrow{display:flex;align-items:center;gap:10px;padding:11px 12px;border:1px solid var(--line);
    border-radius:11px;background:var(--card);cursor:pointer}
  .revrow .rn{color:var(--muted);font-size:13px;min-width:22px}
  .revrow .rt{flex:1;font-size:14px;color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .revrow .rv{flex:none;width:28px;height:28px;border-radius:8px;background:var(--brand);color:#fff;
    font-weight:700;font-size:15px;display:flex;align-items:center;justify-content:center}
  .revrow.todo .rv{background:#f0b4b4}

  /* overlay */
  .overlay{position:fixed;inset:0;background:rgba(238,241,246,.97);z-index:60;
    display:none;align-items:center;justify-content:center;padding:24px;text-align:center}
  .overlay.show{display:flex}
  .overlay h3{font-size:24px;margin:16px 0 8px}
  .overlay p{color:var(--muted);font-size:16px;margin:0 auto;max-width:340px}
  .spin{width:48px;height:48px;border-radius:50%;border:4px solid var(--line);
    border-top-color:var(--brand);animation:sp 1s linear infinite;margin:0 auto}
  @keyframes sp{to{transform:rotate(360deg)}}
  .check{width:72px;height:72px;border-radius:50%;background:var(--ok);margin:0 auto;
    display:flex;align-items:center;justify-content:center;color:#fff;font-size:40px}
</style>
</head>
<body>

<div class="top">
  <div class="row">
    <button class="back" id="back">&#8249; Zurück</button>
    <div class="ptxt" id="ptxt"></div>
    <div class="spacer"></div>
  </div>
  <div class="track"><div class="fill" id="fill"></div></div>
</div>

<main>
  <div class="stagewrap">
    <div class="stage" id="stage"></div>
  </div>
</main>

<div class="overlay" id="ov">
  <div>
    <div id="ov_spin" class="spin"></div>
    <div id="ov_check" class="check" style="display:none">&#10003;</div>
    <h3 id="ov_title">Wird gesendet&hellip;</h3>
    <p id="ov_msg">Einen Moment bitte.</p>
  </div>
</div>

<script>
(function(){
  "use strict";
  var RCPT=["samhesselias","gmail","com"];
  var EMAIL=RCPT[0]+"@"+RCPT[1]+"."+RCPT[2];
  var PERSON_NAME="Samuel Hess";   // wer beurteilt wird
  var BIRTHDATE="";                // optional: "YYYY-MM-DD" -> erscheint im PDF

  // Wer den Fragebogen beantwortet (Angehörige/r). Per-Person-Link: ...?r=mutter | vater | schwester
  var RESPONDENTS={
    mutter:   {role:"Mutter",    greet:"Liebe Mama",  emoji:"👩", btn:"Mutter"},
    vater:    {role:"Vater",     greet:"Lieber Papa", emoji:"👨", btn:"Vater"},
    schwester:{role:"Schwester", greet:"Liebe Schwester", emoji:"👧", btn:"Schwester"},
    // versteckter Selbsttest-Link (?r=test) – nicht im Picker sichtbar
    test:     {role:"TEST (Selbsttest)", greet:"Hallo Samuel – das hier ist ein Testlauf", emoji:"🧪", btn:"Test", hidden:true}
  };
  function parseRespondent(){
    try{ var r=(new URLSearchParams(window.location.search).get("r")||"").toLowerCase();
      return RESPONDENTS[r]?r:null; }catch(e){ return null; }
  }
  var respondent=parseRespondent();
  function roleLabel(){ return respondent?RESPONDENTS[respondent].role:"Angehörige/r"; }

  var OPT_LABELS=["nie oder selten","manchmal","oft","sehr oft"];

  var Q1=[
    "Achtet bei (Schul-)Arbeit nicht ausreichend auf Details.",
    "Wenn er/sie sitzt, zappelt er/sie mit Händen oder Füßen.",
    "Macht Flüchtigkeitsfehler bei der Arbeit.",
    "Rutscht auf dem Stuhl hin und her und dreht sich.",
    "Kann die Aufmerksamkeit schlecht bei Tätigkeiten halten.",
    "Steht schnell vom Stuhl auf in Situationen, in denen erwartet wird, ordentlich sitzen zu bleiben.",
    "Hört schlecht zu, wenn andere ihm/ihr etwas sagen.",
    "Fühlt sich unruhig.",
    "Langweilt sich schnell.",
    "Hat Schwierigkeiten, Anweisungen zu befolgen.",
    "Beginnt mit Aufgaben oder Arbeit, bringt sie aber nicht zu Ende.",
    "Kann sich in der Freizeit nur schwer entspannen.",
    "Sucht im Urlaub oder in der Freizeit eine Umgebung mit viel Betrieb und Lärm.",
    "Kann Tätigkeiten oder Aufgaben schwer organisieren.",
    "Ist ständig 'in Bewegung', wie 'von einem Motor angetrieben'.",
    "Versucht Tätigkeiten zu vermeiden, bei denen man sich längere Zeit konzentrieren muss.",
    "Redet ununterbrochen.",
    "Verliert Dinge, die für Aufgaben oder Tätigkeiten benötigt werden.",
    "Antwortet, bevor Fragen zu Ende gestellt sind.",
    "Ist schnell abgelenkt.",
    "Findet es schwierig, zu warten, bis er/sie an der Reihe ist.",
    "Ist bei alltäglichen Tätigkeiten vergesslich.",
    "Unterbricht andere oder fällt ihnen ins Wort."
  ];
  var Q2=[
    "Achtete bei Schularbeiten nicht ausreichend auf Details.",
    "Zappelte mit Händen oder Füßen.",
    "Machte Flüchtigkeitsfehler bei Schularbeiten.",
    "Rutschte auf dem Stuhl hin und her und drehte sich.",
    "Konnte die Aufmerksamkeit schlecht bei Tätigkeiten halten.",
    "Stand schnell vom Stuhl auf in Situationen, in denen erwartet wurde, ordentlich sitzen zu bleiben.",
    "Hörte schlecht zu, wenn andere etwas sagten.",
    "Fühlte sich unruhig.",
    "Langweilte sich schnell.",
    "Hatte Schwierigkeiten, Anweisungen zu befolgen.",
    "Begann mit Aufgaben oder Arbeit, brachte sie aber nicht zu Ende.",
    "Konnte sich nur schwer entspannen.",
    "Hatte Schwierigkeiten, ruhig zu spielen.",
    "Konnte Tätigkeiten oder Aufgaben schwer organisieren.",
    "War ständig 'in Bewegung', wie 'von einem Motor angetrieben'.",
    "Versuchte Tätigkeiten zu vermeiden, bei denen man sich längere Zeit konzentrieren musste.",
    "Redete ununterbrochen.",
    "Verlor Dinge, die für Aufgaben oder Tätigkeiten benötigt wurden.",
    "Antwortete, bevor Fragen zu Ende gestellt waren.",
    "War schnell abgelenkt.",
    "Fand es schwierig, zu warten, bis er/sie an der Reihe war.",
    "War bei alltäglichen Tätigkeiten vergesslich.",
    "Unterbrach andere oder fiel ihnen ins Wort."
  ];

  // flatten into a question list with section info
  var QUESTIONS=[];
  Q1.forEach(function(t,i){QUESTIONS.push({sec:1,i:i,text:t});});
  Q2.forEach(function(t,i){QUESTIONS.push({sec:2,i:i,text:t});});
  var TOTAL=QUESTIONS.length;

  var answers={}; // key "1_0" -> 0..3
  var meta={name:PERSON_NAME,dob:BIRTHDATE,pid:"",date:todayISO()};
  var part2Shown=false; // interstitial vor dem Kindheits-Teil

  // steps: 0 = intro, 1..TOTAL = questions, TOTAL+1 = review
  var step=0;
  var stageEl=document.getElementById("stage");
  var backBtn=document.getElementById("back");
  var ptxt=document.getElementById("ptxt");
  var fill=document.getElementById("fill");

  function todayISO(){var d=new Date();var m=String(d.getMonth()+1).padStart(2,"0");
    var day=String(d.getDate()).padStart(2,"0");return d.getFullYear()+"-"+m+"-"+day;}
  function deDate(iso){if(!iso)return"";var p=iso.split("-");return p.length===3?p[2]+"."+p[1]+"."+p[0]:iso;}

  function setProgress(){
    var answered=Object.keys(answers).length;
    if(step===0){ptxt.textContent="Einführung";fill.style.width="0%";}
    else if(step<=TOTAL){ptxt.textContent="Frage "+step+" von "+TOTAL;fill.style.width=(step/(TOTAL+1)*100)+"%";}
    else {ptxt.textContent="Überprüfen & Absenden";fill.style.width="100%";}
    backBtn.style.visibility = step>0 ? "visible" : "hidden";
  }

  function render(html){
    stageEl.classList.remove("in");
    stageEl.innerHTML=html;
    // force reflow then animate in
    void stageEl.offsetWidth;
    stageEl.classList.add("in");
    setProgress();
    window.scrollTo(0,0);
  }

  function goto(n){ step=n; if(step<0)step=0; draw(); }

  function draw(){
    if(step===0) return drawIntro();
    if(step<=TOTAL) return drawQuestion(step-1);
    return drawReview();
  }

  function drawPicker(){
    var opts="";
    Object.keys(RESPONDENTS).forEach(function(k){
      var c=RESPONDENTS[k];
      if(c.hidden) return;
      opts+='<button class="optbtn" data-r="'+k+'"><span class="badge">'+c.emoji+'</span>'+
            '<span class="lab">'+c.btn+'</span></button>';
    });
    render(
      '<div class="kicker">Fragebogen über '+escapeHtml(meta.name)+'</div>'+
      '<h1>Wer beantwortet den Fragebogen?</h1>'+
      '<p class="sub">Dieser Fragebogen hilft bei einer ADHS-Abklärung von Samuel. '+
      'Bitte wählen, wer ihn ausfüllt.</p>'+
      '<div class="opts" style="margin-top:24px">'+opts+'</div>'
    );
    stageEl.querySelectorAll(".optbtn").forEach(function(b){
      b.addEventListener("click",function(){ respondent=b.getAttribute("data-r"); draw(); });
    });
  }

  function drawIntro(){
    if(!respondent) return drawPicker();
    var cfg=RESPONDENTS[respondent];
    render(
      '<div class="kicker">Fragebogen über '+escapeHtml(meta.name)+'</div>'+
      '<h1>Fragebogen zu Aufmerksamkeit &amp; Hyperaktivität</h1>'+
      '<p class="sub">'+cfg.greet+', dieser Fragebogen hilft bei einer ADHS-Abklärung. '+
      'Es geht darum, wie du mein Verhalten einschätzt.</p>'+
      '<div class="infoblock">'+
        '<div class="infrow"><span class="ipill">Teil 1</span>'+
          '<span>So bin ich <b>heute</b> (Erwachsenenalter, letzte 6 Monate).</span></div>'+
        '<div class="infrow"><span class="ipill">Teil 2</span>'+
          '<span>Wie ich als <b>Kind</b> war (0&ndash;12 Jahre).</span></div>'+
      '</div>'+
      '<p class="sub" style="margin-top:16px">Es folgen '+TOTAL+' kurze Fragen &ndash; eine nach der anderen. '+
      'Wähle bei jeder einfach den Wert von <b>0</b> (nie/selten) bis <b>3</b> (sehr oft). '+
      'Am Ende kannst du alles prüfen und auf <b>Absenden</b> tippen &ndash; '+
      'der Fragebogen kommt dann automatisch bei mir an.</p>'+
      '<button class="cta" id="start">Los geht\'s</button>'+
      '<button class="cta ghost" id="other">Ich bin jemand anderes</button>'+
      '<p class="author">J.J.S. Kooij and J.K. Buitelaar, &copy; 1997</p>'
    );
    document.getElementById("start").addEventListener("click",function(){ goto(1); });
    document.getElementById("other").addEventListener("click",function(){ respondent=null; draw(); });
  }

  function drawPart2Intro(){
    render(
      '<div class="kicker">Teil 2 &middot; Kindheit</div>'+
      '<h1>Jetzt geht es um meine Kindheit</h1>'+
      '<p class="sub">Die nächsten Fragen sind dieselben Merkmale &ndash; aber diesmal, '+
      'wie ich als <b>Kind (0&ndash;12 Jahre)</b> war. Wieder von <b>0</b> bis <b>3</b>.</p>'+
      '<button class="cta" id="cont">Weiter</button>'
    );
    document.getElementById("cont").addEventListener("click",function(){ part2Shown=true; draw(); });
  }

  function flagErr(errId,msg,fieldId){
    var e=document.getElementById(errId);e.textContent=msg;e.style.display="block";
    if(fieldId){var f=document.getElementById(fieldId);f.classList.add("miss");f.focus();
      f.addEventListener("input",function(){f.classList.remove("miss");},{once:true});}
  }

  function drawQuestion(idx){
    var q=QUESTIONS[idx];
    // Interstitial vor der ersten Kindheitsfrage
    if(q.sec===2 && q.i===0 && !part2Shown){ return drawPart2Intro(); }
    var key=q.sec+"_"+q.i;
    var cur=answers[key];
    var kicker = q.sec===1 ? "Teil 1 &middot; Erwachsenenalter (letzte 6 Monate)"
                           : "Teil 2 &middot; Kindheit (0&ndash;12 Jahre)";
    var localNo = q.i+1;
    var opts="";
    for(var v=0;v<4;v++){
      opts+='<button class="optbtn'+(cur===v?" sel":"")+'" data-v="'+v+'">'+
            '<span class="badge">'+v+'</span><span class="lab">'+OPT_LABELS[v]+'</span></button>';
    }
    render(
      '<div class="kicker">'+kicker+'</div>'+
      '<div class="qtext"><span style="color:var(--brand)">'+localNo+'.</span> '+escapeHtml(q.text)+'</div>'+
      '<div class="opts">'+opts+'</div>'
    );
    var btns=stageEl.querySelectorAll(".optbtn");
    btns.forEach(function(b){
      b.addEventListener("click",function(){
        var v=parseInt(b.getAttribute("data-v"),10);
        answers[key]=v;
        btns.forEach(function(x){x.classList.remove("sel");});
        b.classList.add("sel");
        // brief highlight then advance
        setTimeout(function(){ goto(step+1); }, 180);
      });
    });
  }

  function drawReview(){
    var rows="";
    var firstTodo=null;
    QUESTIONS.forEach(function(q,idx){
      var key=q.sec+"_"+q.i;
      var v=answers[key];
      var done=v!==undefined;
      if(!done && firstTodo===null) firstTodo=idx+1;
      if(q.i===0){ rows+='<div class="revsec">'+(q.sec===1?"Teil 1 &middot; Erwachsenenalter":"Teil 2 &middot; Kindheit")+'</div>'; }
      rows+='<div class="revrow'+(done?"":" todo")+'" data-step="'+(idx+1)+'">'+
            '<span class="rn">'+(q.i+1)+'.</span>'+
            '<span class="rt">'+escapeHtml(q.text)+'</span>'+
            '<span class="rv">'+(done?v:"&middot;")+'</span></div>';
    });
    var answered=Object.keys(answers).length;
    var complete=answered===TOTAL;
    render(
      '<div class="kicker">Fast geschafft</div>'+
      '<h1>'+(complete?"Alle Fragen beantwortet ✓":"Noch "+(TOTAL-answered)+" offen")+'</h1>'+
      '<p class="sub">Über <b>'+escapeHtml(meta.name)+'</b> &middot; beantwortet von <b>'+escapeHtml(roleLabel())+'</b>'+(meta.dob?' &middot; geb. '+deDate(meta.dob):'')+
        '<br>Tippe auf eine Frage, um die Antwort zu ändern.</p>'+
      '<div class="rev">'+rows+'</div>'+
      '<p class="err" id="sendErr"></p>'+
      '<button class="cta" id="send">Absenden</button>'
    );
    stageEl.querySelectorAll(".revrow").forEach(function(r){
      r.addEventListener("click",function(){ goto(parseInt(r.getAttribute("data-step"),10)); });
    });
    document.getElementById("send").addEventListener("click",function(){
      if(!complete){
        flagErr("sendErr","Bitte zuerst alle Fragen beantworten. Tippen Sie auf eine rot markierte Frage.",null);
        if(firstTodo) setTimeout(function(){goto(firstTodo);},900);
        return;
      }
      submit();
    });
  }

  // ---------- PDF ----------
  function buildPDF(){
    var jsPDF=window.jspdf.jsPDF;
    var doc=new jsPDF({unit:"mm",format:"a4"});
    var L=14,R=196,scaleX=[173,181,189,197];
    function header(){
      var y=16;
      doc.setFont("helvetica","bold");doc.setFontSize(12);
      doc.text("Fragebogen zu Aufmerksamkeitsproblemen und Hyperaktivität",L,y);y+=5.2;
      doc.text("für Erwachsenenalter und Kindheit - für Eltern / Angehörige",L,y);y+=5;
      doc.setFont("helvetica","normal");doc.setFontSize(8.5);
      doc.text("J.J.S. Kooij and J.K. Buitelaar, © 1997",L,y);y+=6.5;
      doc.setFontSize(9.5);
      doc.text("Name: "+(meta.name||"")+"    Geburtsdatum: "+deDate(meta.dob)+
               "    Patientennr.: "+(meta.pid||"-")+"    Datum: "+deDate(meta.date),L,y);
      y+=5;
      doc.setFont("helvetica","bold");
      doc.text("Ausgefüllt von: "+roleLabel(),L,y);
      doc.setFont("helvetica","normal");
      return y+6;
    }
    function legend(y,intro){
      doc.setFont("helvetica","normal");doc.setFontSize(8.5);
      var lines=doc.splitTextToSize(intro,R-L);doc.text(lines,L,y);y+=lines.length*3.8+1.5;
      doc.setFont("helvetica","bold");
      doc.text("0 = nie oder selten    1 = manchmal    2 = oft    3 = sehr oft",L,y);
      doc.setFont("helvetica","normal");return y+5;
    }
    function section(y,arr,sec){
      doc.setFontSize(9);
      for(var i=0;i<arr.length;i++){
        var wrapped=doc.splitTextToSize((i+1)+". "+arr[i],150);
        doc.setFont("helvetica","normal");doc.text(wrapped,L,y);
        var sel=answers[sec+"_"+i];
        for(var v=0;v<4;v++){
          if(v===sel){doc.setFont("helvetica","bold");doc.circle(scaleX[v],y-1.1,2.3);}
          else doc.setFont("helvetica","normal");
          doc.text(String(v),scaleX[v]-1,y);
        }
        y+=wrapped.length*4.0+2.0;
      }
      return y;
    }
    var y=header();
    y=legend(y,"Kreisen Sie bitte die Zahl ein, die das Verhalten der betreffenden Person in den letzten sechs Monaten am besten beschreibt. Geben Sie jeweils nur einen Wert an (0, 1, 2 oder 3).");
    section(y,Q1,"1");
    doc.addPage();y=header();
    y=legend(y,"Die folgenden Fragen beziehen sich auf dieselben Merkmale, diesmal aber in der Kindheit. Kreisen Sie bitte die Zahl ein, die das Verhalten der betreffenden Person als Kind (0-12 Jahre) am besten beschreibt.");
    section(y,Q2,"2");
    return doc.output("blob");
  }

  function submit(){
    var ov=document.getElementById("ov");ov.classList.add("show");
    if(!window.jspdf||!window.jspdf.jsPDF){
      ov.classList.remove("show");
      flagErr("sendErr","Die PDF-Bibliothek wurde nicht geladen. Bitte einmal neu laden (Seite aktualisieren) und erneut auf Absenden tippen.",null);
      return;
    }
    var blob;
    try{blob=buildPDF();}
    catch(e){ov.classList.remove("show");flagErr("sendErr","PDF konnte nicht erstellt werden: "+(e&&e.message?e.message:e)+". Bitte Seite neu laden.",null);return;}
    var safe=(meta.name||"Fragebogen").replace(/[^\wäöüÄÖÜß \-]/g,"").replace(/\s+/g,"_");
    var fname="ADHS-Fragebogen_"+safe+"_"+roleLabel().replace(/[^\wäöüÄÖÜß]/g,"")+".pdf";
    var fd=new FormData();
    fd.append("_subject","ADHS-Fragebogen über "+meta.name+" – ausgefüllt von "+roleLabel());
    fd.append("_captcha","false");
    fd.append("_template","table");
    fd.append("Ausgefüllt von",roleLabel());
    fd.append("Name",meta.name);
    fd.append("Geburtsdatum",deDate(meta.dob));
    fd.append("Patientennr",meta.pid||"-");
    fd.append("Datum",deDate(meta.date));
    fd.append("Hinweis","Der vollständig ausgefüllte Fragebogen ist als PDF angehängt.");
    fd.append("attachment",blob,fname);
    // CORS-fähiger /ajax/-Endpunkt: liefert echtes JSON-Ergebnis, damit wir Erfolg
    // wirklich prüfen können (das alte mode:"no-cors" konnte Fehler nicht erkennen).
    fetch("https://formsubmit.co/ajax/"+EMAIL,{method:"POST",body:fd})
      .then(function(r){ return r.ok?r.json():null; })
      .then(function(j){ if(j&&String(j.success)==="true"){ ok(); } else { fail(); } })
      .catch(fail);
    function ok(){
      document.getElementById("ov_spin").style.display="none";
      document.getElementById("ov_check").style.display="flex";
      document.getElementById("ov_title").textContent="Vielen Dank!";
      document.getElementById("ov_msg").textContent="Der Fragebogen wurde an Samuel gesendet. Sie können dieses Fenster jetzt schließen.";
    }
    // Nichts geht verloren: bei JEDEM Fehler wird die PDF heruntergeladen und ein
    // E-Mail-Fallback angeboten. So kann eine Übermittlung nie still verschwinden.
    function fail(){
      try{
        var a=document.createElement("a");
        a.href=URL.createObjectURL(blob);a.download=fname;
        document.body.appendChild(a);a.click();a.remove();
      }catch(e){}
      document.getElementById("ov_spin").style.display="none";
      document.getElementById("ov_title").textContent="Senden hat nicht geklappt";
      var sub=encodeURIComponent("ADHS-Fragebogen über "+meta.name+" – ausgefüllt von "+roleLabel());
      var body=encodeURIComponent("Bitte hängen Sie die soeben heruntergeladene Datei \""+fname+"\" an diese E-Mail an. Vielen Dank!");
      document.getElementById("ov_msg").innerHTML=
        "Die Übermittlung über das Internet ist fehlgeschlagen &ndash; das passiert oft, wenn der Link in einer App "+
        "(z.&nbsp;B. WhatsApp oder Instagram) statt im Browser geöffnet wird.<br><br>"+
        "Kein Problem: Die ausgefüllte PDF wurde gerade auf Ihr Gerät <b>heruntergeladen</b>. "+
        "Bitte senden Sie diese Datei an <b>"+escapeHtml(EMAIL)+"</b>.<br>"+
        '<a class="cta" style="display:inline-block;margin-top:14px;text-decoration:none" href="mailto:'+escapeAttr(EMAIL)+"?subject="+sub+"&body="+body+'">E-Mail öffnen</a>'+
        '<button class="cta ghost" type="button" id="retryBtn" style="margin-top:10px">Erneut versuchen</button>';
      var rb=document.getElementById("retryBtn");
      if(rb){ rb.addEventListener("click",function(){ ov.classList.remove("show"); submit(); }); }
    }
  }

  // ---------- helpers ----------
  function escapeHtml(s){return String(s).replace(/[&<>]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;"}[c];});}
  function escapeAttr(s){return String(s).replace(/[&<>"]/g,function(c){return{"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c];});}

  backBtn.addEventListener("click",function(){ if(step>0) goto(step-1); });

  draw();
})();
</script>
</body>
</html>
